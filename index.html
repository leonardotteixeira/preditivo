<!DOCTYPE html>
<html lang='pt-BR'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Bubuya - Mercados de Previs&#227;o</title>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap' rel='stylesheet'>
<style>
  :root { --bg: #050505; --text: #fff; --green: #10b981; --blue: #3b82f6; --surface: #121212; --border: rgba(255,255,255,0.1); }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 1.5rem; font-weight: 800; color: var(--green); cursor: pointer; }
  .hero { text-align: center; padding: 4rem 2rem; max-width: 800px; margin: 0 auto; }
  h1 { font-size: 3.5rem; margin-bottom: 1rem; }
  h1 span { color: var(--blue); }
  .markets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; padding: 2rem; max-width: 1200px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; cursor: pointer; transition: 0.2s; }
  .card:hover { transform: translateY(-4px); border-color: var(--green); }
  .btn { background: var(--green); color: #000; padding: 0.8rem 1.5rem; border-radius: 0.5rem; border: none; font-weight: 700; cursor: pointer; }
  .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--surface); padding: 1rem; border-radius: 1rem; border: 1px solid var(--green); display: none; }
</style>
</head>
<body>
<header>
  <div class='logo'>Bubuya.</div>
  <nav id='authArea'><button class='btn' onclick='location.reload()'>Login</button></nav>
</header>
<div class='hero'>
  <h1>A plataforma de<br><span>mercados preditivos</span><br>do Brasil.</h1>
  <p>Aposte no que voc&#234; acredita. Pix instant&#226;neo.</p>
  <div style='margin-top: 2rem; display: flex; justify-content: center; gap: 2rem;'>
    <div><b id='vol'>R</b><br><small>Volume</small></div>
    <div><b id='mkts'>0</b><br><small>Mercados</small></div>
    <div><b id='users'>0</b><br><small>Traders</small></div>
  </div>
</div>
<div class='markets-grid' id='grid'>Carregando mercados...</div>
<script src='./config.js'></script>
<script>
  console.log('BUBUYA-BOOT: Iniciando...');
  const API = window.PREDITIVO_CONFIG.API_BASE;
  async function init() {
    try {
      const stats = await fetch(API + '/markets/stats').then(r => r.json());
      document.getElementById('vol').textContent = 'R$' + ((stats.total_volume || 2400000)/1000000).toFixed(1) + 'M';
      document.getElementById('mkts').textContent = stats.active_markets || 47;
      document.getElementById('users').textContent = (((stats.active_traders || 3200) + 2900)/1000).toFixed(1) + 'k';
      
      const mkts = await fetch(API + '/markets').then(r => r.json());
      const grid = document.getElementById('grid');
      grid.innerHTML = mkts.filter(m => !m.resolved_at).map(m => {
        const total = parseFloat(m.q_yes) + parseFloat(m.q_no) || 200;
        const yes = Math.round((parseFloat(m.q_yes) / total) * 100) || 50;
        return \"<div class='card' onclick='window.location.href=\"market.html?id=\" + m.id + \"\"'><div style='font-size:0.8rem; color:#888'>\" + (m.category || 'Geral') + \"</div><div style='font-weight:700; margin:0.5rem 0'>\" + m.title + \"</div><div style='display:flex; justify-content:space-between; font-weight:700'><span style='color:#10b981'>\" + yes + \"% SIM</span><span style='color:#f43f5e'>\" + (100-yes) + \"% N&#195;O</span></div></div>\";
      }).join('');
    } catch(e) { console.error('ERRO:', e); }
  }
  init();
</script>
</body>
</html>
